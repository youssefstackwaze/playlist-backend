# Production profile (public demo). Activated with SPRING_PROFILES_ACTIVE=prod.

# Never expose the H2 web console publicly: it allows running arbitrary SQL/code.
spring.h2.console.enabled=false

# The Angular static site is hosted on Render (any *.onrender.com sub-domain).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:4200}

server.compression.enabled=true
server.forward-headers-strategy=framework

logging.level.root=WARN
logging.level.com.example.music=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
