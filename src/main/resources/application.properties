spring.application.name=music-playlist
# Hosting platforms (Render, ...) inject the port to listen on
server.port=${PORT:8080}

# Origins allowed to call /api/** from a browser (front-end hosted elsewhere)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.datasource.url=jdbc:h2:mem:musicdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
info.app.name=Music Playlist Management System
