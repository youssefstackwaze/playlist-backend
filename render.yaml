# Render Blueprint (backend repository): https://render.com/docs/blueprint-spec
services:
  - type: web
    name: playlist-musique-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Origins allowed to call the API from a browser (the Angular site).
      # Default in the prod profile: https://*.onrender.com,http://localhost:4200
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://playlist-musique-frontend.onrender.com
